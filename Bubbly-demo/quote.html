<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Free Dog Poop Scooping Quote | Poop Scoop Detail Boise Area</title>
  <meta name="description" content="Get a fast, free quote for professional dog poop scooping services in Boise, Idaho. Weekly, biweekly, and one-time cleanups available." />

  <style>
    :root {
      --light-color: #dcefd8;
      --mid-color: #9fcb9b;
      --dark-color: #2f5d3b;
      --white: #ffffff;
      --text-color: #2f5d3b;
    }
    
    .theme-green {
      --light-color: #dcefd8;
      --mid-color: #9fcb9b;
      --dark-color: #2f5d3b;
      --text-color: #2f5d3b;
      --muted-color: #456b4d;
      --hover-color: #24492e;
    }
    
    .theme-purple {
      --light-color: #eadff0;
      --mid-color: #b895c7;
      --dark-color: #654475;
      --text-color: #654475;
      --muted-color: #80658d;
      --hover-color: #513560;
    }
    
    .theme-red {
      --light-color: #f3dddd;
      --mid-color: #d49a9a;
      --dark-color: #8a3f3f;
      --text-color: #8a3f3f;
      --muted-color: #9d6060;
      --hover-color: #713333;
    }
    
    .theme-blue {
      --light-color: #dce8f3;
      --mid-color: #9bb8d3;
      --dark-color: #416482;
      --text-color: #416482;
      --muted-color: #5e7c96;
      --hover-color: #34536d;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      opacity: 0;
      animation: pageFadeIn 0.8s ease-out forwards;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(
        180deg,
        var(--white) 0%,
        var(--light-color) 100%
      );
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid rgba(47, 93, 59, 0.12);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 720px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(47, 93, 59, 0.08);
      backdrop-filter: blur(4px);
    }

    @keyframes pageFadeIn {
      to {
        opacity: 1;
      }
    }

    .logo {
      opacity: 0;
      transform: translateY(10px) scale(0.98);
      animation: logoEnter 1s ease-out 0.2s forwards;
      max-width: 240px;
      width: 100%;
      margin: 0 auto 28px auto;
      display: block;
    }

    @keyframes logoEnter {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    h1 {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 700;
      color: var(--dark-color);
      margin-bottom: 14px;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 1.15rem;
      color: var(--muted-color);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .construction-badge {
      display: inline-block;
      background: var(--dark-color);
      color: white;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0 auto 28px auto;
      letter-spacing: 0.3px;
    }

    .contact-box {
      background: #f7fbf6;
      border: 1px solid rgba(47, 93, 59, 0.12);
      border-radius: 18px;
      padding: 28px;
      margin-top: 10px;
    }

    .contact-box p {
      line-height: 1.7;
      margin-bottom: 18px;
      color: var(--muted-color);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 20px;
    }

    .links a {
      text-decoration: none;
      color: white;
      background: var(--dark-color);
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(47, 93, 59, 0.15);
      position: relative;
      overflow: hidden;
    }

    .links a:hover {
      background: var(--hover-color);
      transform: translateY(-3px);
      box-shadow:
        0 8px 20px rgba(47, 93, 59, 0.25),
        0 0 12px rgba(159, 203, 155, 0.35);
    }

    .links a::before {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 255, 255, 0.25),
        transparent
      );
      transform: skewX(-20deg);
    }

    .links a:hover::before {
      animation: shimmer 0.6s ease;
    }
    
    @keyframes shimmer {
      100% {
        left: 125%;
      }
    }
    
    .badge-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .service-area {
      margin-bottom: 26px;
      text-align: center;
    }
    
    .service-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted-color);
      margin-bottom: 10px;
    }
    
    .service-grid {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(2, max-content);
      gap: 8px 40px;
      justify-content: center;
      padding: 0;
      margin: 0;
      font-size: 0.9rem;
      color: var(--dark-color);
      font-weight: 500;
    }

    .service-grid li {
      text-align: left;
    }
    
    .email {
      display: inline-block;
      margin-top: 16px;
      color: var(--dark-color);
      font-weight: 600;
      text-decoration: none;
    }

    .footer {
      margin-top: 34px;
      font-size: 0.9rem;
      color: #6d8a73;
    }

    @media (max-width: 600px) {
      .container {
        padding: 38px 24px;
      }

      .links {
        flex-direction: column;
      }

      .links a {
        width: 100%;
      }
    }
  </style>
</head>

<body class="theme-red">

<main class="container">

  <img src="assets/PS Detail Fin.png" class="logo" alt="Poop Scoop Detail Logo" />

  <nav class="nav">
    <a href="index2.html">Home</a> 
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="pricing.html">Pricing</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
  </nav>
  
  <h1>Get Your Free Quote</h1>

  <p class="subtitle">
    Request a fast, free quote for professional dog poop scooping services.
    We respond to all inquiries within 24 hours.
  </p>

  <section class="form-box">

    <form id="quoteForm" action="https://formspree.io/f/mdabwpbz" method="POST">

      <!-- Formspree email formatting -->
      <input type="hidden" name="_subject" value="New Quote Request - Poop Scoop Detail" />
      <input type="hidden" name="_template" value="table" />

      <!-- Honeypot (spam trap) -->
      <div class="honeypot">
        <label>Do not fill this out</label>
        <input type="text" name="website" tabindex="-1" autocomplete="off" />
      </div>

      <div class="form-grid">

        <div>
          <label>First Name</label>
          <input type="text" name="firstName" required />
        </div>

        <div>
          <label>Last Name</label>
          <input type="text" name="lastName" required />
        </div>

        <div>
          <label>Phone</label>
          <input type="tel" name="phone" required />
        </div>

        <div>
          <label>Email</label>
          <input type="email" name="email" required />
        </div>

        <div>
          <label>City</label>
          <input type="text" name="city" required />
        </div>

        <div>
          <label>Zip Code</label>
          <input type="text" name="zip" required />
        </div>

        <div>
          <label>Service Type</label>
          <select name="serviceType">
            <option>One-Time</option>
            <option>Weekly</option>
            <option>Biweekly</option>
          </select>
        </div>

        <div>
          <label>Yard Size</label>
          <select name="yardSize">
            <option>Small</option>
            <option>Medium</option>
            <option>Large</option>
            <option>X-Large / Open Property</option>
          </select>
        </div>

        <div class="full">
          <label>Grass Length</label>
          <select name="grassLength">
            <option>Short</option>
            <option>Medium</option>
            <option>Tall</option>
            <option>Overgrown</option>
          </select>
        </div>

      </div>

      <button class="submit-btn" type="submit">
        Request My Free Quote
      </button>

    </form>

  </section>

</main>

  <script>
    const form = document.getElementById("quoteForm");
  
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
  
      const formData = new FormData(form);
  
      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: formData,
          headers: {
            'Accept': 'application/json'
          }
        });
  
        if (response.ok) {
          window.location.href = "thank-you.html";
        } else {
          alert("Something went wrong. Please try again.");
        }
  
      } catch (error) {
        alert("Network error. Please try again.");
      }
    });
  </script>
  
</body>
</html>
